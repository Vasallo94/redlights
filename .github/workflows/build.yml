name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read   # por defecto solo lectura; el job de release pide lo suyo

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # build.sh saca la versión de los tags y el build del nº de commits

      - name: Compilar
        run: ./build.sh --zip

      - name: Comprobar el bundle
        run: ./scripts/check-bundle.sh

      - uses: actions/upload-artifact@v7
        with:
          name: RedLights-macos
          path: RedLights-*.zip

  linux:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]   # x86_64 y ARM64 (Raspberry Pi)
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # git describe → versión del binario

      - name: Dependencias de prueba (Xvfb, Mutter, D-Bus)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xvfb mutter dbus-x11 libglib2.0-bin

      - name: Formato
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests del núcleo
        run: cargo test

      - name: Compilar binario estático (musl) y .deb
        run: |
          # musl: binario estático que funciona con cualquier glibc (Raspberry Pi OS, Ubuntu 22.04…)
          T="$(uname -m)-unknown-linux-musl"
          rustup target add "$T"
          export REDLIGHTS_VERSION="$(git describe --tags --always | sed 's/^v//')"
          cargo build --release --target "$T"
          cargo install cargo-deb --locked --quiet
          mkdir -p out
          cp "target/$T/release/redlights" out/
          cargo deb --no-build --target "$T" --deb-version "$REDLIGHTS_VERSION" -o out/redlights.deb
          file out/redlights && dpkg-deb -I out/redlights.deb | grep -E "Version|Architecture"

      - name: Tests de integración y prueba del binario publicado (X11 y GNOME Mutter)
        run: |
          export DISPLAY=:99 XDG_RUNTIME_DIR="$(mktemp -d)"
          Xvfb :99 -screen 0 1280x800x24 &
          for i in $(seq 30); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 1; done
          dbus-run-session -- bash -c '
            set -e
            mutter --x11 --replace &
            # Esperar a que Mutter publique su API en D-Bus (en un runner lento tarda más de 5 s)
            for i in $(seq 60); do
              gdbus introspect --session --dest org.gnome.Mutter.DisplayConfig \
                --object-path /org/gnome/Mutter/DisplayConfig >/dev/null 2>&1 && break
              sleep 1
            done
            cargo test -- --ignored --test-threads=1
            # El binario estático real: aplica, recibe SIGTERM, restaura y sale con 0
            for b in x11 mutter; do
              REDLIGHTS_BACKEND=$b timeout --preserve-status 3 out/redlights 0.5
              REDLIGHTS_BACKEND=$b out/redlights reset
            done
            out/redlights --version
            # Bandeja: arranca, toggle/status por D-Bus, una sola instancia y cierre limpio
            REDLIGHTS_BACKEND=x11 out/redlights tray & T=$!
            sleep 2
            out/redlights status | grep -qx off
            out/redlights toggle | grep -q "^on at"
            ! timeout 5 out/redlights tray
            out/redlights toggle | grep -qx off
            gdbus call --session --dest io.github.Vasallo94.RedLights \
              --object-path /io/github/Vasallo94/RedLights --method io.github.Vasallo94.RedLights.Quit
            wait $T'

      - uses: actions/upload-artifact@v7
        with:
          name: redlights-linux-${{ runner.arch }}
          path: rust/out/*

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Vulnerabilidades, licencias y orígenes de las dependencias (cargo-deny)
        working-directory: rust
        run: |
          cargo install cargo-deny --locked --quiet
          # Una vez por plataforma publicada: ver el porqué en deny.toml
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-pc-windows-msvc; do
            echo "== $t"
            cargo deny --target "$t" check advisories licenses sources
          done

  windows:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests del núcleo
        run: cargo test

      - name: Test de integración (API de Magnificación)
        run: cargo test -- --ignored apply_restore_roundtrip

      - name: Compilar
        shell: pwsh
        run: |
          $env:REDLIGHTS_VERSION = (git describe --tags --always) -replace '^v', ''
          cargo build --release

      - name: Bandeja (arranca y sigue viva)
        shell: pwsh
        run: |
          $p = Start-Process -PassThru target/release/redlights.exe -ArgumentList "tray"
          Start-Sleep -Seconds 4
          if ($p.HasExited) { throw "la bandeja se cerró al arrancar (código $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force

      - name: ¿Sobrevive el efecto si el proceso muere? (informativo)
        shell: pwsh
        run: |
          $p = Start-Process -PassThru -NoNewWindow target/release/redlights.exe -ArgumentList "0.5"
          Start-Sleep -Seconds 3
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 1
          cargo test -q -- --ignored --nocapture print_current_effect

      - uses: actions/upload-artifact@v7
        with:
          name: redlights-windows-x64
          path: rust/target/release/redlights.exe

  release:
    needs: [build, linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write       # crear la release
      id-token: write       # firmar la attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7   # CHANGELOG.md y LICENSE

      - uses: actions/download-artifact@v8   # sin nombre: cada artefacto en su carpeta

      - name: Empaquetar
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir dist
          mv "RedLights-macos/RedLights-$V.zip" dist/   # con versión: el tap de Homebrew depende del nombre
          # Linux y Windows sin versión, para enlazar siempre a releases/latest/download/<archivo>
          for pair in X64:x86_64 ARM64:aarch64; do
            dir="redlights-linux-${pair%%:*}"
            chmod +x "$dir/redlights"   # los artefactos pierden el bit de ejecución
            tar -czf "dist/redlights-linux-${pair##*:}.tar.gz" -C "$dir" redlights -C "$GITHUB_WORKSPACE" LICENSE
          done
          mv redlights-linux-X64/redlights.deb dist/redlights-linux-amd64.deb
          mv redlights-linux-ARM64/redlights.deb dist/redlights-linux-arm64.deb
          zip -j "dist/redlights-windows-x64.zip" redlights-windows-x64/redlights.exe LICENSE
          cd dist && for f in *; do shasum -a 256 "$f" > "$f.sha256"; done && ls -l

      - name: Attestation de procedencia
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          # Notas: la sección de esa versión en CHANGELOG.md
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md no tiene sección [$V]"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* --title "RedLights $V" --notes-file notes.md
