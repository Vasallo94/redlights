name: winget

# Genera, valida e instala los manifiestos de winget de una versión publicada.
# Se lanza a mano: Actions → winget → Run workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versión publicada (p. ej. 0.3.1)
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generar manifiestos
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "versión no válida: $VERSION"; exit 1; }
          scripts/winget-manifests.sh "$VERSION" winget

      - name: winget más reciente (el del runner no conoce el último esquema)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}   # el módulo consulta la API de GitHub
        run: |
          # Opcional: si falla, se valida con el winget que trae el runner
          try {
            Install-PSResource Microsoft.WinGet.Client -TrustRepository -Scope AllUsers -ErrorAction Stop
            Repair-WinGetPackageManager -AllUsers -Latest -ErrorAction Stop
          } catch {
            Write-Warning "No se pudo actualizar winget: $_"
          }
          winget --version

      - name: Validar e instalar con winget
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $dir = "winget/manifests/v/Vasallo94/RedLights/$env:VERSION"
          # Los avisos (p. ej. un winget antiguo que no conoce el esquema) no bloquean;
          # la prueba definitiva es la instalación de abajo.
          $v = winget validate --manifest $dir | Out-String
          Write-Output $v
          if ($v -notmatch 'Manifest validation succeeded') { throw "winget validate falló" }
          winget settings --enable LocalManifestFiles
          winget install --manifest $dir --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE) { throw "winget install falló" }
          $out = & "$env:LOCALAPPDATA\Microsoft\WinGet\Links\redlights.exe" --version
          Write-Output $out
          if ($out -ne "redlights $env:VERSION") { throw "versión inesperada: $out" }

      - uses: actions/upload-artifact@v7
        with:
          name: winget-manifests-${{ inputs.version }}
          path: winget/
