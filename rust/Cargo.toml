[package]
name = "redlights"
# La versión real sale del tag de git: el CI la pasa en REDLIGHTS_VERSION al binario
# y en --deb-version al paquete. Este número no se usa y no hay que actualizarlo.
version = "0.0.0"
edition = "2024"
description = "Turn every display pure red for astronomy without losing your night vision"
license = "MIT"
repository = "https://github.com/Vasallo94/redlights"
homepage = "https://github.com/Vasallo94/redlights"
readme = "README.md"
keywords = ["astronomy", "night-vision", "gamma", "wayland", "x11"]
categories = ["command-line-utilities"]

# Paquete .deb (cargo deb). La versión la pone el CI desde el tag (--deb-version).
[package.metadata.deb]
maintainer = "Vasallo94 <Vasallo94@users.noreply.github.com>"
copyright = "2026, Vasallo94"
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = """\
RedLights changes the colors the display outputs so that green and blue are \
zero and red is dimmed to the chosen level, keeping your eyes adapted to the \
dark while using a computer next to the telescope. Supports X11, GNOME and \
wlroots-based Wayland compositors (Sway, Hyprland, labwc, Wayfire, niri)."""
assets = [
    ["target/release/redlights", "usr/bin/", "755"],
    ["../LICENSE", "usr/share/doc/redlights/", "644"],
    ["README.md", "usr/share/doc/redlights/", "644"],
    ["packaging/redlights.desktop", "usr/share/applications/", "644"],
    ["../assets/icon.svg", "usr/share/icons/hicolor/scalable/apps/redlights.svg", "644"],
]

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
rustix = { version = "1.1.5", features = ["fs"] }
serde = "1.0.229"
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb = { version = "0.14.0", features = ["randr"] }
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }

[target."cfg(windows)".dependencies]
global-hotkey = "0.9.0"
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Magnification", "Win32_Foundation", "Win32_System_Console", "Win32_Globalization", "Win32_UI_WindowsAndMessaging"] }
