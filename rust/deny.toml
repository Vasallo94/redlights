# cargo deny: vulnerabilidades, licencias y orígenes de las dependencias.
# Se ejecuta una vez por plataforma publicada (cargo deny --target <triple> check):
# con varias a la vez, cargo-deny une las condiciones de todas y cuenta crates que
# ningún binario real compila (p. ej. el GTK de tray-icon, que solo usamos en Windows).

[advisories]
# Por defecto: deniega vulnerabilidades, crates sin mantenimiento y versiones retiradas.

[licenses]
# Todas permisivas y compatibles con distribuir RedLights bajo MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "MPL-2.0", # option-ext: copyleft por archivo; su código fuente está disponible en crates.io
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
